<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="From particle collisions to business insights">
  <style>
    /* Transparent background: colours adapt to GitHub light and dark mode */
    .title { font: 700 30px system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }
    .label { font: 600 14px system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #59636e; letter-spacing: 1px; }
    .ink   { fill: #1f2328; }
    .inks  { stroke: #1f2328; }
    .axis  { stroke: #8c959f; }
    .track { fill: none; stroke-width: 2.5; stroke-linecap: round; }
    @media (prefers-color-scheme: dark) {
      .title { fill: #e6edf3; }
      .label { fill: #9198a1; }
      .ink   { fill: #e6edf3; }
      .inks  { stroke: #e6edf3; }
      .axis  { stroke: #656c76; }
    }
  </style>

  <!-- headline -->
  <text x="600" y="70" text-anchor="middle" class="title">From particle collisions to business insights</text>

  <!-- ============ LEFT: particle collision ============ -->
  <g>
    <path class="track" stroke="#2f81f7" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0" d="M260 200 Q310 150 390 140">
      <animate attributeName="stroke-dashoffset" values="100;0;0;100" keyTimes="0;0.25;0.88;1" dur="7s" repeatCount="indefinite"/>
    </path>
    <path class="track" stroke="#e5534b" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0" d="M260 200 Q205 155 140 135">
      <animate attributeName="stroke-dashoffset" values="100;0;0;100" keyTimes="0;0.22;0.88;1" dur="7s" repeatCount="indefinite"/>
    </path>
    <path class="track" stroke="#8957e5" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0" d="M260 200 Q330 225 395 260">
      <animate attributeName="stroke-dashoffset" values="100;0;0;100" keyTimes="0;0.28;0.88;1" dur="7s" repeatCount="indefinite"/>
    </path>
    <path class="track" stroke="#2da44e" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0" d="M260 200 Q190 230 125 255">
      <animate attributeName="stroke-dashoffset" values="100;0;0;100" keyTimes="0;0.24;0.88;1" dur="7s" repeatCount="indefinite"/>
    </path>
    <path class="track" stroke="#d4761f" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0" d="M260 200 Q275 240 300 270">
      <animate attributeName="stroke-dashoffset" values="100;0;0;100" keyTimes="0;0.2;0.88;1" dur="7s" repeatCount="indefinite"/>
    </path>
    <path class="track" stroke="#1b9aaa" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0" d="M260 200 Q240 150 255 120">
      <animate attributeName="stroke-dashoffset" values="100;0;0;100" keyTimes="0;0.23;0.88;1" dur="7s" repeatCount="indefinite"/>
    </path>

    <!-- collision flash -->
    <circle class="ink" cx="260" cy="200" r="6">
      <animate attributeName="r" values="0;16;6;6;0" keyTimes="0;0.06;0.15;0.88;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.9;1;1;0" keyTimes="0;0.06;0.15;0.88;1" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle class="inks" cx="260" cy="200" r="22" fill="none" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="4;40;40" keyTimes="0;0.14;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0" keyTimes="0;0.14;1" dur="7s" repeatCount="indefinite"/>
    </circle>

    <text x="260" y="300" text-anchor="middle" class="label">PARTICLE PHYSICS</text>
  </g>

  <!-- ============ MIDDLE: data flowing ============ -->
  <g>
    <circle r="4" fill="#2f81f7" cx="440" cy="190"><animate attributeName="cx" values="440;780" dur="2.4s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="0s" repeatCount="indefinite"/></circle>
    <circle r="4" fill="#e5534b" cx="440" cy="205"><animate attributeName="cx" values="440;780" dur="2.4s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle r="4" fill="#8957e5" cx="440" cy="220"><animate attributeName="cx" values="440;780" dur="2.4s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle r="4" fill="#2da44e" cx="440" cy="198"><animate attributeName="cx" values="440;780" dur="2.4s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle r="4" fill="#d4761f" cx="440" cy="213"><animate attributeName="cx" values="440;780" dur="2.4s" begin="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle r="4" fill="#1b9aaa" cx="440" cy="183"><animate attributeName="cx" values="440;780" dur="2.4s" begin="2.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="2.0s" repeatCount="indefinite"/></circle>

    <!-- arrow -->
    <path class="axis" d="M560 248 H660" stroke-width="2" fill="none"/>
    <path class="axis" d="M652 241 L662 248 L652 255" stroke-width="2" fill="none" stroke-linejoin="round"/>
    <text x="610" y="300" text-anchor="middle" class="label">PYTHON · SQL · ML</text>
  </g>

  <!-- ============ RIGHT: business chart ============ -->
  <g>
    <path class="axis" d="M845 130 V270 H1105" stroke-width="2" fill="none"/>

    <rect x="865" width="34" rx="4" fill="#2f81f7" y="230" height="40">
      <animate attributeName="height" values="0;0;40;40;0" keyTimes="0;0.3;0.45;0.88;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="y" values="270;270;230;230;270" keyTimes="0;0.3;0.45;0.88;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect x="913" width="34" rx="4" fill="#2f81f7" y="210" height="60">
      <animate attributeName="height" values="0;0;60;60;0" keyTimes="0;0.33;0.48;0.88;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="y" values="270;270;210;210;270" keyTimes="0;0.33;0.48;0.88;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect x="961" width="34" rx="4" fill="#2f81f7" y="220" height="50">
      <animate attributeName="height" values="0;0;50;50;0" keyTimes="0;0.36;0.51;0.88;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="y" values="270;270;220;220;270" keyTimes="0;0.36;0.51;0.88;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect x="1009" width="34" rx="4" fill="#2f81f7" y="185" height="85">
      <animate attributeName="height" values="0;0;85;85;0" keyTimes="0;0.39;0.54;0.88;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="y" values="270;270;185;185;270" keyTimes="0;0.39;0.54;0.88;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect x="1057" width="34" rx="4" fill="#2da44e" y="150" height="120">
      <animate attributeName="height" values="0;0;120;120;0" keyTimes="0;0.42;0.57;0.88;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="y" values="270;270;150;150;270" keyTimes="0;0.42;0.57;0.88;1" dur="7s" repeatCount="indefinite"/>
    </rect>

    <polyline class="inks" points="882,218 930,198 978,208 1026,173 1074,138" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" values="100;100;0;0;100" keyTimes="0;0.58;0.72;0.88;1" dur="7s" repeatCount="indefinite"/>
    </polyline>
    <circle cx="1074" cy="138" r="5" fill="#2da44e">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.7;0.73;0.88;1" dur="7s" repeatCount="indefinite"/>
    </circle>

    <text x="975" y="300" text-anchor="middle" class="label">BUSINESS INSIGHTS</text>
  </g>
</svg>
